<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registry PRO · Smart Ledger</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        /* ── Fonts ── */
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #080c16;
            min-height: 100vh;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── Ambient Glow ── */
        .ambient-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 40%, rgba(16, 185, 129, 0.10) 0%, rgba(59, 130, 246, 0.05) 40%, transparent 70%);
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 0;
        }
        .ambient-glow-2 {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle at 70% 80%, rgba(16, 185, 129, 0.06) 0%, rgba(139, 92, 246, 0.04) 40%, transparent 70%);
            bottom: -200px;
            right: -100px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Glassmorphism ── */
        .glass-card {
            background: rgba(12, 20, 35, 0.75);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px -16px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ── Auto-expand Textareas ── */
        .auto-expand {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            overflow: hidden;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
            white-space: pre-wrap;
            transition: all 0.1s ease;
            color: #f8fafc;
            padding: 5px 0;
            display: block;
            font-family: 'Outfit', sans-serif;
        }
        .auto-expand::placeholder {
            color: rgba(148, 163, 184, 0.35);
            font-weight: 400;
        }
        .auto-expand:focus {
            color: #ffffff;
        }

        .price-input {
            width: 100%;
            text-align: right;
            font-weight: 600;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.95rem;
            resize: none;
            overflow: hidden;
            word-break: break-all;
            white-space: pre-wrap;
            color: #34d399;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            padding: 5px 0;
            display: block;
            transition: color 0.2s;
        }
        .price-input::placeholder {
            color: rgba(52, 211, 153, 0.2);
            font-weight: 400;
        }
        .price-input:focus {
            color: #6ee7b7;
        }

        .delete-btn {
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.15s ease, background 0.2s;
            transform: scale(0.85);
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid transparent;
            color: #f87171;
            border-radius: 8px;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            line-height: 1.4;
            transition: all 0.2s ease;
        }
        tr:hover .delete-btn {
            opacity: 1;
            transform: scale(1);
        }
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* ── Row Animation ── */
        .row-anim {
            animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .row-remove {
            animation: slideOut 0.2s cubic-bezier(0.4, 0, 1, 1) forwards;
        }
        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(20px);
                height: 0;
                padding: 0;
                overflow: hidden;
            }
        }

        /* ── Grand Total ── */
        .grand-total-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .grand-total-val {
            width: 100%;
            text-align: right;
            word-break: break-all;
            white-space: normal;
            line-height: 1.15;
            display: block;
        }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: #10b981;
            color: #080c16;
            padding: 10px 28px;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            box-shadow: 0 16px 48px -8px rgba(16, 185, 129, 0.4);
            z-index: 999;
            font-family: 'Outfit', sans-serif;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Export Dropdown ── */
        .export-dropdown {
            position: relative;
            display: inline-block;
        }
        .export-dropdown .menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: rgba(12, 20, 35, 0.94);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 6px;
            min-width: 170px;
            opacity: 0;
            transform: scale(0.95) translateY(-6px);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 24px 56px -12px rgba(0, 0, 0, 0.6);
            z-index: 50;
        }
        .export-dropdown .menu.open {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .export-dropdown .menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #e2e8f0;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.01em;
        }
        .export-dropdown .menu button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #34d399;
        }
        .export-dropdown .menu button .icon {
            margin-right: 12px;
            opacity: 0.5;
        }

        /* ── Save Indicator ── */
        .save-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .save-dot.saved {
            background: #34d399;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.3);
        }
        .save-dot.saving {
            background: #fbbf24;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
            animation: pulse-dot 0.6s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        /* ── Buttons ── */
        .btn-ghost {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 6px 14px;
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .btn-ghost:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            border-color: rgba(255, 255, 255, 0.12);
        }
        .btn-ghost:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }
        .btn-ghost.primary {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }
        .btn-ghost.primary:hover {
            background: rgba(16, 185, 129, 0.22);
            border-color: rgba(16, 185, 129, 0.25);
        }
        .btn-ghost.danger {
            color: #f87171;
        }
        .btn-ghost.danger:hover {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .btn-ghost.emerald {
            color: #34d399;
        }
        .btn-ghost.emerald:hover {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.2);
        }
        .btn-primary-gradient {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #080c16;
            border: none;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
        }
        .btn-primary-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.35);
        }
        .btn-primary-gradient:active {
            transform: scale(0.96);
        }

        /* ── Management UI ── */
        .mgmt-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 6px 14px;
            color: #f8fafc;
            font-size: 0.7rem;
            font-weight: 500;
            outline: none;
            font-family: 'Outfit', sans-serif;
            width: 120px;
            transition: all 0.2s;
        }
        .mgmt-input:focus {
            border-color: rgba(16, 185, 129, 0.35);
            background: rgba(255, 255, 255, 0.07);
        }
        .mgmt-input::placeholder {
            color: #64748b;
        }

        .mgmt-select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 6px 14px;
            color: #cbd5e1;
            font-size: 0.7rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            min-width: 140px;
            transition: all 0.2s;
        }
        .mgmt-select:focus {
            border-color: rgba(16, 185, 129, 0.3);
        }
        .mgmt-select option {
            background: #1a2538;
            color: #f1f5f9;
        }

        /* ── Exporting state (hides UI for image) ── */
        .exporting .mgmt-ui {
            display: none !important;
        }
        .exporting .no-print {
            display: none !important;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ── Print Styles ── */
        @media print {
            body {
                background: #fff !important;
                color: #0f172a !important;
                padding: 0.5in !important;
            }
            .ambient-glow,
            .ambient-glow-2,
            .no-print {
                display: none !important;
            }
            .glass-card {
                background: #fff !important;
                backdrop-filter: none !important;
                border: 1px solid #e2e8f0 !important;
                box-shadow: none !important;
            }
            .glass-card * {
                color: #0f172a !important;
            }
            .price-input,
            .auto-expand {
                color: #0f172a !important;
            }
            .price-input {
                color: #059669 !important;
            }
            .grand-total-val {
                color: #059669 !important;
            }
            .delete-btn {
                display: none !important;
            }
            #toast {
                display: none !important;
            }
            .export-dropdown .menu {
                display: none !important;
            }
            .btn-ghost {
                display: none !important;
            }
            .btn-primary-gradient {
                display: none !important;
            }
            tr {
                border-bottom-color: #e2e8f0 !important;
            }
            .glass-pill {
                background: #f1f5f9 !important;
                border-color: #e2e8f0 !important;
            }
            .glass-pill code {
                background: #e2e8f0 !important;
                color: #0f172a !important;
            }
            [class*="bg-emerald"] {
                background: #059669 !important;
            }
            [class*="text-emerald"] {
                color: #059669 !important;
            }
            .border-emerald-500\/20 {
                border-color: #059669 !important;
            }
            .bg-emerald-500\/10 {
                background: #ecfdf5 !important;
            }
            .mgmt-ui {
                display: none !important;
            }
        }

        /* ── Mobile ── */
        @media (max-width: 640px) {
            .delete-btn {
                opacity: 0.5;
                transform: scale(1);
                padding: 2px 6px;
                font-size: 0.6rem;
            }
            tr:hover .delete-btn {
                opacity: 0.5;
            }
            .mgmt-input {
                width: 80px;
                font-size: 0.6rem;
                padding: 4px 10px;
            }
            .mgmt-select {
                min-width: 100px;
                font-size: 0.6rem;
                padding: 4px 10px;
            }
            .btn-ghost {
                font-size: 0.6rem;
                padding: 4px 10px;
            }
            .btn-primary-gradient {
                font-size: 0.6rem;
                padding: 6px 14px;
            }
            #toast {
                font-size: 0.6rem;
                padding: 8px 18px;
                bottom: 18px;
            }
        }

        /* ── Extra polish ── */
        .section-divider {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.06), transparent);
        }

        .badge-emerald {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 2px 10px;
            border-radius: 99px;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .glow-text-emerald {
            text-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
        }
    </style>
</head>
<body class="p-3 sm:p-6 lg:p-10 flex flex-col items-center justify-start relative">

    <!-- Ambient Glows -->
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <div class="w-full max-w-4xl space-y-5 relative z-10">

        <!-- ─── Navbar ─── -->
        <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-3 px-1">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="h-11 w-11 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/25 font-black text-slate-950 text-xl tracking-tighter">
                    R
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        Registry<span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono font-medium">PRO</span>
                    </h1>
                    <p class="text-xs text-slate-400 font-medium flex items-center gap-2.5">
                        <span>Fluid Calculator</span>
                        <span class="save-dot saved" id="saveDot"></span>
                        <span id="itemCount" class="text-[10px] text-slate-500 font-mono">0 items</span>
                    </p>
                </div>
            </div>

            <!-- Management UI -->
            <div id="managementUI" class="flex flex-wrap items-center gap-1.5 mgmt-ui">
                <button onclick="toggleAutoSave()" id="autoSaveToggle" class="btn-ghost primary flex items-center gap-1.5">
                    <span id="autoSaveIcon">⚡</span>
                    <span id="autoSaveLabel">Auto-Save: ON</span>
                </button>

                <input type="text" id="saveListName" placeholder="List name…" class="mgmt-input" />
                <button onclick="saveCurrentList()" class="btn-ghost primary">💾 Save</button>

                <select id="savedListsDropdown" onchange="loadSavedList(this.value)" class="mgmt-select">
                    <option value="">📂 Load List</option>
                </select>
                <button onclick="deleteSelectedList()" class="btn-ghost danger" title="Delete selected list">🗑</button>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-1.5 self-end xl:self-auto flex-wrap justify-end no-print">
                <button onclick="undoAction()" id="undoBtn" class="btn-ghost" disabled title="Undo (⌘Z)">↩ Undo</button>
                <button onclick="redoAction()" id="redoBtn" class="btn-ghost" disabled title="Redo (⌘Y)">↪ Redo</button>
                <button onclick="addNewRow()" class="btn-ghost emerald">+ Add Row</button>
                <button onclick="deleteCurrentList()" class="btn-ghost danger">✕ Delete List</button>

                <!-- Export -->
                <div class="export-dropdown">
                    <button onclick="toggleExportMenu()" class="btn-primary-gradient flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Export
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-2.5 w-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    <div class="menu" id="exportMenu">
                        <button onclick="exportImage()"><span class="icon">🖼</span> PNG Image</button>
                        <button onclick="exportCSV()"><span class="icon">📊</span> CSV</button>
                        <button onclick="exportJSON()"><span class="icon">📄</span> JSON</button>
                        <button onclick="window.print()"><span class="icon">🖨</span> Print</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ─── Main Card ─── -->
        <div id="capture-area" class="glass-card rounded-3xl overflow-hidden border border-white/10 relative">

            <!-- Header -->
            <div class="p-5 sm:p-7 border-b border-white/5 flex flex-wrap justify-between items-end gap-3 bg-white/[0.01]">
                <div>
                    <div class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold mb-0.5 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        Official Entry
                    </div>
                    <h2 class="text-2xl font-extrabold tracking-tight text-white glow-text-emerald">Shopping Ledger</h2>
                    <p id="live-date" class="text-xs text-slate-400 font-medium mt-0.5"></p>
                </div>
                <div class="text-right">
                    <div id="live-time" class="text-2xl font-extrabold text-emerald-400 font-mono-num tracking-tight glow-text-emerald"></div>
                    <div class="text-[10px] uppercase tracking-widest text-slate-500 font-semibold mt-0.5">IST Kolkata</div>
                </div>
            </div>

            <!-- Table -->
            <div class="p-4 sm:p-7">
                <table class="w-full table-fixed">
                    <thead>
                        <tr class="text-slate-400 text-[10px] uppercase tracking-widest font-bold border-b border-white/10">
                            <th class="pb-2.5 w-8 text-center">#</th>
                            <th class="pb-2.5 px-2 text-left">Item Description</th>
                            <th class="pb-2.5 w-32 sm:w-44 text-right">Amount (₹)</th>
                            <th class="pb-2.5 w-8 text-center no-print"> </th>
                        </tr>
                    </thead>
                    <tbody id="list-body" class="divide-y divide-white/5">
                        <!-- rows injected -->
                    </tbody>
                </table>

                <!-- Grand Total -->
                <div class="mt-8 pt-5 border-t border-white/10 flex flex-col items-start gap-2 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Total Payable</span>
                    </div>
                    <div class="grand-total-container">
                        <span class="text-3xl sm:text-4xl font-extrabold tracking-tight text-emerald-300 font-mono-num grand-total-val glow-text-emerald">
                            ₹<span id="grand-total">0.00</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="bg-black/30 px-6 sm:px-8 py-3.5 text-[10px] text-slate-500 font-semibold uppercase tracking-widest flex justify-between items-center border-t border-white/5">
                <span id="footer-timestamp"></span>
                <span class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400/60"></span>
                    Auto-Saved
                </span>
            </div>
        </div>

        <!-- Formula Guide -->
        <div class="glass-pill rounded-2xl p-3.5 text-center text-xs text-slate-400 font-medium tracking-wide flex flex-wrap items-center justify-center gap-2 no-print">
            <span>⚡ Formula:</span>
            <code class="text-emerald-400 font-mono bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20">cal 56g 56 100g</code>
            <span>→ cost</span>
            <code class="text-emerald-400 font-mono bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20">cal 56g 56 250</code>
            <span>→ grams</span>
            <span class="text-slate-600">·</span>
            <span class="text-slate-400">Math: <code class="text-emerald-400 font-mono bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">(10+20)*3</code></span>
            <span class="text-slate-600">·</span>
            <span class="text-slate-400">⌘Z ↶ &nbsp;⌘Y ↷</span>
            <span class="text-slate-600">·</span>
            <span class="text-slate-400">📋 Paste JSON to import</span>
            <span class="text-slate-600">·</span>
            <span class="text-slate-400">Type <code class="text-emerald-400 font-mono bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">c </code> Chicken, <code class="text-emerald-400 font-mono bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">m </code> Mutton</span>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast">✓ Done</div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const STATE_KEY = 'registry_pro_current';
        const SAVED_LISTS_KEY = 'registry_pro_saved_lists';

        let items = [];
        let nextId = 1;
        let history = [];
        let historyIndex = -1;
        let isRestoring = false;
        let saveTimeout = null;
        let autoSaveEnabled = true;
        let currentListId = null;
        let isUpdatingFromCode = false;

        // DOM refs
        const listBody = document.getElementById('list-body');
        const grandTotalEl = document.getElementById('grand-total');
        const itemCountEl = document.getElementById('itemCount');
        const saveDot = document.getElementById('saveDot');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const exportMenu = document.getElementById('exportMenu');
        const savedListsDropdown = document.getElementById('savedListsDropdown');
        const autoSaveToggleBtn = document.getElementById('autoSaveToggle');
        const autoSaveLabel = document.getElementById('autoSaveLabel');
        const autoSaveIcon = document.getElementById('autoSaveIcon');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CLOCK
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateClock() {
            const now = new Date();
            const dateOpt = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', timeZone: 'Asia/Kolkata' };
            const timeOpt = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' };
            document.getElementById('live-date').textContent = now.toLocaleDateString('en-IN', dateOpt);
            document.getElementById('live-time').textContent = now.toLocaleTimeString('en-IN', timeOpt);
            document.getElementById('footer-timestamp').textContent = now.toLocaleString('en-IN', { dateStyle: 'medium',
                timeStyle: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  FORMULA & MATH PARSER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function evaluateMath(expr) {
            const sanitized = expr.replace(/[^0-9+\-*/(). ]/g, '');
            if (sanitized !== expr) return { result: null, error: 'Invalid characters' };
            if (!sanitized.trim()) return { result: null, error: 'Empty expression' };
            try {
                const result = new Function(`return (${expr})`)();
                if (typeof result !== 'number' || !isFinite(result)) return { result: null, error: 'Invalid result' };
                return { result, error: null };
            } catch (e) {
                return { result: null, error: e.message };
            }
        }

        function parseAndCalculatePrice(inputStr) {
            const clean = inputStr.trim();
            if (!clean) return { formula: '', displayVal: '', rawStr: '0' };

            // ── 'cal' formula ──
            if (clean.toLowerCase().startsWith('cal ')) {
                const parts = clean.split(/\s+/);
                if (parts.length === 4) {
                    const match1 = parts[1].match(/^([\d.]+)\s*([a-zA-Z]*)$/);
                    const r1 = parseFloat(parts[2]);
                    if (match1 && !isNaN(r1)) {
                        const g1 = parseFloat(match1[1]);
                        const unit1 = match1[2] || 'g';
                        const match3 = parts[3].match(/^([\d.]+)\s*([a-zA-Z]*)$/);
                        if (match3) {
                            const val3 = parseFloat(match3[1]);
                            const unit3 = match3[2];
                            if (!isNaN(g1) && g1 > 0) {
                                if (unit3 !== '') {
                                    const result = (r1 / g1) * val3;
                                    const formatted = Number.isInteger(result) ? result.toString() : result.toFixed(2);
                                    return { formula: inputStr, displayVal: formatted, rawStr: formatted };
                                } else {
                                    const result = (g1 / r1) * val3;
                                    const formatted = Number.isInteger(result) ? result.toString() : result.toFixed(2);
                                    return { formula: inputStr, displayVal: `${formatted}${unit1}`, rawStr: val3.toString() };
                                }
                            }
                        }
                    }
                }
                return { formula: inputStr, displayVal: inputStr, rawStr: '0' };
            }

            // ── Math engine ──
            const mathResult = evaluateMath(clean);
            if (mathResult.result !== null) {
                const val = mathResult.result;
                const formatted = Number.isInteger(val) ? val.toString() : val.toFixed(2);
                return { formula: inputStr, displayVal: formatted, rawStr: formatted };
            }

            // ── Fallback: number extraction ──
            const digits = clean.replace(/[^0-9.]/g, '');
            return { formula: inputStr, displayVal: inputStr, rawStr: digits || '0' };
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ITEM CRUD (no categories)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function createItem(name = '', priceFormula = '') {
            const result = parseAndCalculatePrice(priceFormula);
            const item = { id: nextId++, name, priceFormula, priceDisplay: result.displayVal, rawValue: result.rawStr };
            items.push(item);
            return item;
        }

        function updateItem(id, field, value) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            if (field === 'name') {
                item.name = value;
            } else if (field === 'priceFormula') {
                const result = parseAndCalculatePrice(value);
                item.priceFormula = value;
                item.priceDisplay = result.displayVal;
                item.rawValue = result.rawStr;
            }
            // Only refresh totals, not the whole DOM
            updateTotalsAndCount();
            if (autoSaveEnabled) autoSave();
            pushHistory();
        }

        function deleteItem(id) {
            const idx = items.findIndex(i => i.id === id);
            if (idx === -1) return;
            items.splice(idx, 1);
            renderRows();
            updateTotalsAndCount();
            if (autoSaveEnabled) autoSave();
            pushHistory();
            // Clean up empty rows after a delay (user has stopped interacting)
            setTimeout(manageEmptyRows, 50);
        }

        function clearItems() {
            items = [];
            nextId = 1;
            renderRows();
            updateTotalsAndCount();
            if (autoSaveEnabled) autoSave();
            pushHistory();
        }

        function deleteCurrentList() {
            if (items.length === 0) { showToast('⚠️ List is already empty'); return; }
            if (!confirm('Delete the entire current list?')) return;
            clearItems();
            showToast('🗑 List deleted');
        }

        function addNewRow() {
            createItem('', '');
            renderRows();
            updateTotalsAndCount();
            if (autoSaveEnabled) autoSave();
            pushHistory();
            // Do NOT focus the new row – user chooses where to move
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  JSON IMPORT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function importItems(data) {
            if (!Array.isArray(data)) return false;
            let imported = 0;
            data.forEach(obj => {
                if (typeof obj === 'string') { createItem(obj, '');
                    imported++; } else if (typeof obj === 'object' && obj !== null && obj.item) {
                    const name = obj.item || '';
                    const cost = obj.cost !== undefined ? String(obj.cost) : '';
                    createItem(name, cost);
                    imported++;
                }
            });
            if (imported > 0) {
                renderRows();
                updateTotalsAndCount();
                if (autoSaveEnabled) autoSave();
                pushHistory();
                showToast(`📥 Imported ${imported} items`);
                return true;
            }
            return false;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER (only rows, not full re-render)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderRows() {
            const scrollY = window.scrollY;
            listBody.innerHTML = '';

            let nonEmptyCounter = 0;
            const itemCount = items.length;

            items.forEach((item, idx) => {
                const isEmpty = !item.name.trim() && !item.priceFormula.trim();
                const tr = document.createElement('tr');
                tr.className = 'row-anim border-b border-white/5 hover:bg-white/[0.02] transition-colors';
                tr.id = `row-${item.id}`;

                // Only assign a number if non-empty, else show dash
                let numberDisplay = '';
                if (!isEmpty) {
                    nonEmptyCounter++;
                    numberDisplay = nonEmptyCounter;
                } else {
                    // If it's the last row and empty, we show nothing (dash)
                    numberDisplay = idx === itemCount - 1 ? '' : '-';
                }

                tr.innerHTML = `
                    <td class="text-center text-slate-600 font-mono-num text-xs py-3 align-top font-semibold">${numberDisplay}</td>
                    <td class="px-2 py-2 align-top">
                        <textarea rows="1" class="auto-expand placeholder-slate-600 font-medium" 
                                  placeholder="Item details… (or paste JSON)" 
                                  data-id="${item.id}"
                                  data-field="name">${escHtml(item.name)}</textarea>
                    </td>
                    <td class="py-2 align-top text-right">
                        <div class="price-container">
                            <textarea rows="1" placeholder="0.00 (or math expr)" 
                                      data-id="${item.id}"
                                      data-field="priceFormula"
                                      class="price-input placeholder-slate-700">${escHtml(item.priceDisplay)}</textarea>
                        </div>
                    </td>
                    <td class="py-2 align-top text-center no-print">
                        <button class="delete-btn" data-id="${item.id}" title="Delete row">✕</button>
                    </td>
                `;
                listBody.appendChild(tr);
            });

            // Auto-expand all textareas
            listBody.querySelectorAll('textarea').forEach(ta => {
                ta.style.height = 'auto';
                ta.style.height = ta.scrollHeight + 'px';
            });

            window.scrollTo(0, scrollY);
        }

        function escHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENT DELEGATION (for inputs and buttons)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        listBody.addEventListener('input', function(e) {
            const target = e.target;
            if (target.tagName !== 'TEXTAREA') return;
            const id = parseInt(target.dataset.id);
            if (!id) return;
            const field = target.dataset.field;
            if (!field) return;

            // Auto-expand
            target.style.height = 'auto';
            target.style.height = target.scrollHeight + 'px';

            let val = target.value;

            // ── Shortcuts: c -> Chicken, m -> Mutton ──
            if (field === 'name') {
                if (val === 'c ') { val = 'Chicken ';
                    target.value = val; }
                if (val === 'm ') { val = 'Mutton ';
                    target.value = val; }
                if (val === 'c' || val === 'm') return; // wait for space

                // ── JSON import detection ──
                if ((val.startsWith('[') || val.startsWith('{')) && val.length > 2) {
                    try {
                        const parsed = JSON.parse(val);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            const success = importItems(parsed);
                            if (success) {
                                target.value = '';
                                target.style.height = 'auto';
                                return;
                            }
                        }
                    } catch (_) {}
                }
            }

            // Update the item
            updateItem(id, field, val);

            // Auto-create row if this is the last row and it has content
            const rows = listBody.querySelectorAll('tr');
            const lastRow = rows[rows.length - 1];
            if (lastRow && lastRow.id === `row-${id}`) {
                const hasContent = items.some(i => i.name.trim() || i.priceFormula.trim());
                if (hasContent) {
                    const lastItem = items[items.length - 1];
                    if (lastItem && (lastItem.name.trim() || lastItem.priceFormula.trim())) {
                        // Check if the last item is the only one and empty? Actually we want to create if the last has content.
                        // But we need to avoid creating duplicate empty rows. We'll check if there's already an empty row at the end.
                        const lastRowIsEmpty = items.length > 0 && !items[items.length - 1].name.trim() && !items[items
                            .length - 1].priceFormula.trim();
                        if (!lastRowIsEmpty) {
                            // Create a new row without moving focus
                            createItem('', '');
                            renderRows();
                            updateTotalsAndCount();
                            if (autoSaveEnabled) autoSave();
                            pushHistory();
                            // Keep focus on current textarea? After render, we need to restore focus.
                            // Since we re-render, we lose focus. We'll store the active element id and re-focus.
                            const activeId = id;
                            setTimeout(() => {
                                const newTa = document.querySelector(`textarea[data-id="${activeId}"]`);
                                if (newTa) {
                                    newTa.focus();
                                    newTa.selectionStart = newTa.selectionEnd = newTa.value.length;
                                }
                            }, 10);
                        }
                    }
                }
            }
        });

        listBody.addEventListener('focusout', function(e) {
            const target = e.target;
            if (target.tagName !== 'TEXTAREA') return;
            const id = parseInt(target.dataset.id);
            if (!id) return;
            const field = target.dataset.field;
            if (field === 'priceFormula') {
                // Re-parse and update display on blur
                const item = items.find(i => i.id === id);
                if (item) {
                    const result = parseAndCalculatePrice(target.value);
                    item.priceFormula = target.value;
                    item.priceDisplay = result.displayVal;
                    item.rawValue = result.rawStr;
                    target.value = result.displayVal;
                    target.style.height = 'auto';
                    target.style.height = target.scrollHeight + 'px';
                    updateTotalsAndCount();
                    if (autoSaveEnabled) autoSave();
                    pushHistory();
                }
            }
            // Manage empty rows on blur (after user finishes editing)
            setTimeout(manageEmptyRows, 50);
        });

        listBody.addEventListener('click', function(e) {
            const target = e.target;
            if (target.classList.contains('delete-btn')) {
                const id = parseInt(target.dataset.id);
                if (id) deleteItem(id);
            }
        });

        // ─── Manage empty trailing rows ───
        function manageEmptyRows() {
            if (isUpdatingFromCode) return;
            let changed = false;
            // Remove trailing empty rows except the last one
            while (items.length > 1) {
                const last = items[items.length - 1];
                const prev = items[items.length - 2];
                if (!last.name.trim() && !last.priceFormula.trim() &&
                    !prev.name.trim() && !prev.priceFormula.trim()) {
                    items.pop();
                    changed = true;
                } else {
                    break;
                }
            }
            // Ensure at least one row
            if (items.length === 0) {
                createItem('', '');
                changed = true;
            }
            if (changed) {
                renderRows();
                updateTotalsAndCount();
                if (autoSaveEnabled) autoSave();
                pushHistory();
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  TOTALS & COUNT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateTotalsAndCount() {
            let totalInt = 0n;
            let totalDec = 0;

            items.forEach(item => {
                const str = item.rawValue || '0';
                if (!str || str === '0') return;
                const parts = str.split('.');
                try { totalInt += BigInt(parts[0] || '0'); } catch (_) {}
                if (parts[1]) {
                    const dv = parseFloat(`0.${parts[1]}`);
                    if (!isNaN(dv)) totalDec += dv;
                }
            });

            if (totalDec >= 1) {
                totalInt += BigInt(Math.floor(totalDec));
                totalDec -= Math.floor(totalDec);
            }
            const decStr = totalDec.toFixed(2).split('.')[1];
            grandTotalEl.textContent = formatIndianNumber(totalInt.toString(), decStr);

            // Count non-empty items for display
            const nonEmptyCount = items.filter(i => i.name.trim() || i.priceFormula.trim()).length;
            itemCountEl.textContent = `${nonEmptyCount} item${nonEmptyCount !== 1 ? 's' : ''}`;
        }

        function formatIndianNumber(intStr, decStr) {
            let lastThree = intStr.slice(-3);
            let other = intStr.slice(0, -3);
            if (other !== '') lastThree = ',' + lastThree;
            const formattedInt = other.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + lastThree;
            return `${formattedInt}.${decStr || '00'}`;
        }

        function getRawTotal() {
            let totalInt = 0n;
            let totalDec = 0;
            items.forEach(item => {
                const str = item.rawValue || '0';
                if (!str || str === '0') return;
                const parts = str.split('.');
                try { totalInt += BigInt(parts[0] || '0'); } catch (_) {}
                if (parts[1]) {
                    const dv = parseFloat(`0.${parts[1]}`);
                    if (!isNaN(dv)) totalDec += dv;
                }
            });
            if (totalDec >= 1) {
                totalInt += BigInt(Math.floor(totalDec));
                totalDec -= Math.floor(totalDec);
            }
            const decStr = totalDec.toFixed(2).split('.')[1];
            return formatIndianNumber(totalInt.toString(), decStr);
        }

        function getNonEmptyItems() {
            return items.filter(i => i.name.trim() || i.priceFormula.trim());
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  PERSISTENCE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function autoSave() {
            if (!autoSaveEnabled) { saveDot.className = 'save-dot saved'; return; }
            clearTimeout(saveTimeout);
            saveDot.className = 'save-dot saving';
            saveTimeout = setTimeout(() => {
                try {
                    const data = { items, nextId, currentListId, autoSaveEnabled };
                    localStorage.setItem(STATE_KEY, JSON.stringify(data));
                    saveDot.className = 'save-dot saved';
                } catch (_) { saveDot.className = 'save-dot saved'; }
            }, 300);
        }

        function loadCurrentState() {
            try {
                const raw = localStorage.getItem(STATE_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (data.items && Array.isArray(data.items)) {
                    items = data.items;
                    nextId = data.nextId || (items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1);
                    currentListId = data.currentListId || null;
                    autoSaveEnabled = data.autoSaveEnabled !== undefined ? data.autoSaveEnabled : true;
                    items.forEach(item => {
                        if (item.priceDisplay === undefined) {
                            const res = parseAndCalculatePrice(item.priceFormula || '');
                            item.priceDisplay = res.displayVal;
                            item.rawValue = res.rawStr;
                        }
                    });
                    updateAutoSaveToggle();
                    return true;
                }
            } catch (_) {}
            return false;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SAVED LISTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getSavedLists() {
            try { return JSON.parse(localStorage.getItem(SAVED_LISTS_KEY)) || []; } catch { return []; }
        }

        function setSavedLists(lists) {
            localStorage.setItem(SAVED_LISTS_KEY, JSON.stringify(lists));
            renderSavedListsDropdown();
        }

        function renderSavedListsDropdown() {
            const lists = getSavedLists();
            savedListsDropdown.innerHTML = `<option value="">📂 Load List</option>`;
            lists.forEach(list => {
                const opt = document.createElement('option');
                opt.value = list.id;
                const count = list.items ? list.items.filter(i => i.name || i.priceFormula).length : 0;
                opt.textContent = `${list.name} (${count} items)`;
                if (list.id == currentListId) opt.selected = true;
                savedListsDropdown.appendChild(opt);
            });
        }

        function saveCurrentList() {
            const nameInput = document.getElementById('saveListName');
            const name = nameInput.value.trim() || 'Untitled';
            const nonEmpty = getNonEmptyItems();
            if (nonEmpty.length === 0) { showToast('⚠️ No items to save'); return; }
            const lists = getSavedLists();
            const newList = {
                id: Date.now(),
                name,
                items: JSON.parse(JSON.stringify(nonEmpty)),
                autoSaveEnabled,
                createdAt: new Date().toISOString()
            };
            lists.push(newList);
            setSavedLists(lists);
            nameInput.value = '';
            currentListId = newList.id;
            renderSavedListsDropdown();
            showToast(`💾 List "${name}" saved!`);
        }

        function loadSavedList(id) {
            if (!id) return;
            const lists = getSavedLists();
            const list = lists.find(l => l.id == id);
            if (!list) return;
            if (items.length > 0) {
                if (!confirm('Current list will be replaced. Continue?')) {
                    savedListsDropdown.value = '';
                    return;
                }
            }
            items = JSON.parse(JSON.stringify(list.items));
            nextId = items.reduce((max, i) => Math.max(max, i.id), 0) + 1;
            currentListId = list.id;
            autoSaveEnabled = list.autoSaveEnabled !== undefined ? list.autoSaveEnabled : true;
            updateAutoSaveToggle();
            renderRows();
            updateTotalsAndCount();
            pushHistory();
            autoSave();
            renderSavedListsDropdown();
            showToast(`📂 Loaded: ${list.name}`);
            savedListsDropdown.value = currentListId;
        }

        function deleteSelectedList() {
            const selectedId = savedListsDropdown.value;
            if (!selectedId) { showToast('⚠️ No list selected'); return; }
            if (!confirm('Delete this saved list?')) return;
            let lists = getSavedLists();
            lists = lists.filter(l => l.id != selectedId);
            setSavedLists(lists);
            if (currentListId == selectedId) {
                currentListId = null;
                savedListsDropdown.value = '';
            }
            renderSavedListsDropdown();
            showToast('🗑 List deleted');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  AUTO-SAVE TOGGLE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function toggleAutoSave() {
            autoSaveEnabled = !autoSaveEnabled;
            updateAutoSaveToggle();
            if (autoSaveEnabled) { autoSave();
                showToast('⚡ Auto-Save: ON'); } else showToast('⚡ Auto-Save: OFF');
            if (currentListId) {
                const lists = getSavedLists();
                const list = lists.find(l => l.id == currentListId);
                if (list) { list.autoSaveEnabled = autoSaveEnabled;
                    setSavedLists(lists); }
            }
        }

        function updateAutoSaveToggle() {
            if (autoSaveEnabled) {
                autoSaveLabel.textContent = 'Auto-Save: ON';
                autoSaveIcon.textContent = '⚡';
                autoSaveToggleBtn.classList.add('primary');
            } else {
                autoSaveLabel.textContent = 'Auto-Save: OFF';
                autoSaveIcon.textContent = '⏸';
                autoSaveToggleBtn.classList.remove('primary');
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HISTORY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function pushHistory() {
            if (isRestoring) return;
            const snapshot = JSON.stringify({ items, nextId });
            history = history.slice(0, historyIndex + 1);
            history.push(snapshot);
            if (history.length > 50) history.shift();
            historyIndex = history.length - 1;
            updateHistoryButtons();
        }

        function undoAction() {
            if (historyIndex <= 0) return;
            historyIndex--;
            restoreSnapshot(history[historyIndex]);
        }

        function redoAction() {
            if (historyIndex >= history.length - 1) return;
            historyIndex++;
            restoreSnapshot(history[historyIndex]);
        }

        function restoreSnapshot(snapshot) {
            isRestoring = true;
            try {
                const data = JSON.parse(snapshot);
                items = data.items;
                nextId = data.nextId;
                renderRows();
                updateTotalsAndCount();
                if (autoSaveEnabled) autoSave();
            } catch (_) {}
            isRestoring = false;
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            undoBtn.disabled = historyIndex <= 0;
            redoBtn.disabled = historyIndex >= history.length - 1;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EXPORT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function toggleExportMenu() {
            exportMenu.classList.toggle('open');
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.export-dropdown')) exportMenu.classList.remove('open');
        });

        function exportImage() {
            exportMenu.classList.remove('open');
            const area = document.getElementById('capture-area');
            if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') {
                document.activeElement.blur();
            }

            // Swap textareas with divs
            const swaps = [];
            area.querySelectorAll('textarea').forEach(ta => {
                const parent = ta.parentNode;
                const div = document.createElement('div');
                div.className = ta.classList.contains('price-input') ? 'export-div-price' : 'export-div-name';
                div.textContent = ta.value;
                parent.insertBefore(div, ta);
                ta.style.display = 'none';
                swaps.push({ ta, div });
            });

            const dels = area.querySelectorAll('.delete-btn');
            dels.forEach(el => el.style.display = 'none');
            area.classList.add('exporting');

            const now = new Date();
            const dateStr =
                `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

            html2canvas(area, { scale: 3, useCORS: true, backgroundColor: '#080c16' }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Registry_${dateStr}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                swaps.forEach(({ ta, div }) => { ta.style.display = 'block';
                    div.remove(); });
                dels.forEach(el => el.style.display = '');
                area.classList.remove('exporting');
                showToast('📸 Snapshot exported');
            }).catch(err => {
                console.error(err);
                showToast('⚠️ Export failed');
                swaps.forEach(({ ta, div }) => { ta.style.display = 'block';
                    div.remove(); });
                dels.forEach(el => el.style.display = '');
                area.classList.remove('exporting');
            });
        }

        function exportCSV() {
            exportMenu.classList.remove('open');
            const nonEmpty = getNonEmptyItems();
            if (nonEmpty.length === 0) { showToast('No items to export'); return; }
            let csv = '#,Item,Amount (₹)\n';
            nonEmpty.forEach((item, idx) => {
                const cleanName = item.name.replace(/,/g, ' ').trim() || '(unnamed)';
                csv += `${idx+1},"${cleanName}","${item.rawValue || '0'}"\n`;
            });
            csv += `\nTotal,,"${getRawTotal()}"`;
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Registry_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            showToast('📊 CSV downloaded');
        }

        function exportJSON() {
            exportMenu.classList.remove('open');
            const nonEmpty = getNonEmptyItems();
            if (nonEmpty.length === 0) { showToast('No items to export'); return; }
            const exportData = nonEmpty.map((item, idx) => ({
                'sl.no': idx + 1,
                'item': item.name || 'Unnamed',
                'cost': item.priceDisplay || '0.00'
            }));
            exportData.push({ 'total': getRawTotal() });
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Registry_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            showToast('📄 JSON exported');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  TOAST
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'show';
            clearTimeout(el._hide);
            el._hide = setTimeout(() => { el.className = ''; }, 2200);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  KEYBOARD SHORTCUTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault();
                undoAction(); }
            if ((e.metaKey || e.ctrlKey) && e.key === 'y') { e.preventDefault();
                redoAction(); }
            if (e.key === 'Escape') exportMenu.classList.remove('open');
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function init() {
            const hasState = loadCurrentState();
            if (!hasState || items.length === 0) {
                items = [];
                nextId = 1;
                createItem('', '');
                autoSave();
            }
            renderSavedListsDropdown();
            updateAutoSaveToggle();
            renderRows();
            updateTotalsAndCount();
            pushHistory();
            setTimeout(autoSave, 100);
            setTimeout(() => { saveDot.className = 'save-dot saved'; }, 400);
            if (currentListId) savedListsDropdown.value = currentListId;
            // Clean up empty rows after load
            setTimeout(manageEmptyRows, 50);
        }

        init();
    </script>
</body>
</html>
